<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>WebView Bridge Detector</title>

<style>
body{
    background:#111;
    color:#00ff66;
    font-family:monospace;
    padding:16px;
}
h2{
    color:white;
}
.box{
    border:1px solid #00ff66;
    border-radius:10px;
    padding:12px;
    margin:12px 0;
    white-space:pre-wrap;
    word-break:break-all;
}
button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    font-size:16px;
}
</style>
</head>

<body>

<h2>WebView Bridge Detector</h2>

<button onclick="scan()">开始检测</button>

<div id="out"></div>

<script>

function print(title,text){

    let d=document.createElement("div");

    d.className="box";

    d.innerText=
        "===== "+title+" =====\n\n"+
        text;

    document.getElementById("out").appendChild(d);
}


function inspect(name,obj){

    let result="";

    if(obj === undefined){
        return name+" : undefined";
    }

    if(obj === null){
        return name+" : null";
    }

    result += "类型: "+typeof obj+"\n\n";

    try{

        let keys=Object.getOwnPropertyNames(obj);

        result+="自身属性:\n";

        keys.forEach(function(k){

            try{

                result+=
                    "  "+k+
                    " ["+typeof obj[k]+"]\n";

            }catch(e){

                result+=
                    "  "+k+
                    " [无法读取]\n";
            }

        });

    }catch(e){

        result+="读取自身属性失败\n";
    }


    try{

        let proto=Object.getPrototypeOf(obj);

        if(proto){

            let keys=
                Object.getOwnPropertyNames(proto);

            result+="\n原型属性:\n";

            keys.forEach(function(k){

                try{

                    result+=
                        "  "+k+
                        " ["+typeof proto[k]+"]\n";

                }catch(e){

                    result+=
                        "  "+k+
                        " [无法读取]\n";
                }

            });

        }

    }catch(e){

        result+="读取原型失败\n";
    }


    return result;
}


function scan(){

    document.getElementById("out").innerHTML="";


    print(
        "UserAgent",
        navigator.userAgent
    );


    print(
        "android",
        inspect(
            "android",
            window.android
        )
    );


    print(
        "ToutiaoJSBridge",
        inspect(
            "ToutiaoJSBridge",
            window.ToutiaoJSBridge
        )
    );


    print(
        "byted_mixrender_native",
        inspect(
            "byted_mixrender_native",
            window.byted_mixrender_native
        )
    );


    print(
        "lesJSBridgeTransferMonitor",
        inspect(
            "lesJSBridgeTransferMonitor",
            window.lesJSBridgeTransferMonitor
        )
    );


    print(
        "jsIELiveTimingMonitor",
        inspect(
            "jsIELiveTimingMonitor",
            window.jsIELiveTimingMonitor
        )
    );


    let result="";


    for(let key in window){

        if(
            /bridge|native|xiaomi|miui|car|vehicle|android|toutiao|byted/i
            .test(key)
        ){

            result +=
                key+
                " ["+
                typeof window[key]+
                "]\n";
        }

    }


    print(
        "Window相关对象",
        result
    );

}

</script>

</body>
</html>
