<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>
SU7 WebView Scanner
</title>

<style>

body{
background:#000;
color:#00ff66;
font-family:monospace;
padding:20px;
}

h1{
font-size:22px;
}

.box{

border:1px solid #00ff66;
padding:15px;
margin:15px 0;
border-radius:8px;

}

button{

background:#00ff66;
border:0;
padding:10px 20px;
font-size:16px;

}

pre{

white-space:pre-wrap;

}

</style>

</head>


<body>


<h1>
🚗 Android WebView Scanner
</h1>


<button onclick="scan()">
开始扫描
</button>


<div class="box">
<pre id="result">
等待扫描...
</pre>
</div>



<script>


function log(t){

document.getElementById(
"result"
).innerHTML += t+"\n";

}



function scan(){


document.getElementById(
"result"
).innerHTML="";


log("===== 环境 =====");


log(
"UA:\n"+
navigator.userAgent
);


log(
"Platform: "+
navigator.platform
);


log(
"URL: "+
location.href
);



log("\n===== 全局 Bridge =====");



let targets=[

"android",

"Android",

"bridge",

"JSBridge",

"TouTiaoJSBridge",

"ToutiaoJSBridge",

"byted_mixrender_native",

"iesJsBridgeTransferMonitor",

"scanBridge",

"xiaomi",

"miui",

"car",

"vehicle",

"native"

];



targets.forEach(function(n){


try{


if(window[n]){


log(
"[发现] "+
n+
" 类型:"+
typeof window[n]
);


scanObject(
window[n],
n
);


}else{


log(
"[无] "+
n
);


}


}catch(e){

log(
n+
" 错误 "+
e
);

}

});



log("\n===== URI能力 =====");


let schemes=[

"http://",

"https://",

"file://",

"content://",

"intent://"

];


schemes.forEach(s=>{

try{

let a=document.createElement("a");

a.href=s;

log(
s+
" 支持构造"
);


}catch(e){

log(
s+
"失败"
);

}

});




log("\n===== 浏览器能力 =====");


let caps=[

"localStorage",

"indexedDB",

"File",

"Blob",

"WebSocket",

"WebRTC",

"Worker",

"serviceWorker"

];


caps.forEach(c=>{


let ok;


try{

ok=
window[c] ||
navigator[c];

}catch(e){

ok=false;

}


log(
(c)+
" : "+
(ok?"存在":"不存在")
);


});



log("\n===== 扫描完成 =====");



}




function scanObject(obj,name){


try{


log(
"--- "+name+" ---"
);


let keys=
Object.getOwnPropertyNames(obj);



keys.forEach(k=>{


let type;


try{

type=
typeof obj[k];

}catch(e){

type="error";

}


log(
"  "+k+
" : "+
type
);


});



}catch(e){

log(
"对象读取失败"
);

}


}



</script>


</body>
</html>
