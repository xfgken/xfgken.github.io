<!DOCTYPE html>
<html>
<body>

<h2>JS对象检测</h2>

<pre id="out"></pre>


<script>

let arr = [];

[
"bridge",
"JSBridge",
"webkit",
"xiaomi",
"miui",
"car",
"vehicle",
"android"
].forEach(function(name){

    let a;

    try{
        a = typeof window[name];
    }catch(e){
        a="error";
    }

    arr.push(
        name + " : " + a
    );

});


document.getElementById("out").innerText =
arr.join("\n");


</script>

</body>
</html>
