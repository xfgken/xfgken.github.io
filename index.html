<!DOCTYPE html>
<html>
<body>

<pre id="log"></pre>

<script>

let log="";

function out(t){
 log+=t+"\n";
 document.getElementById("log").innerText=log;
}


out("检测开始");


if(window.byted_mixrender_native){

let old=
window.byted_mixrender_native.invoke;


window.byted_mixrender_native.invoke=function(){

out(
"发现调用:"
+
JSON.stringify(arguments)
);


return old.apply(this,arguments);

};


out("invoke监听成功");

}else{

out("没有找到");

}


</script>

</body>
</html>
