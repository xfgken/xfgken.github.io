<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf9f7">
<meta name="color-scheme" content="light dark">
<meta name="description" id="metaDesc" content="个人主页">
<title>加载中…</title>
<link rel="stylesheet" href="css/style.css?v=59">
</head>

<body>

<div class="progress" id="progress"></div>

<!-- 移动端顶栏 -->
<header class="mobile-bar">
  <a class="mb-name" href="#top" id="mbName"></a>
  <div class="mb-actions">
    <button class="icon-btn" id="themeBtnM" aria-label="切换主题">
      <span class="theme-icons">
        <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>
          <path d="m4.9 4.9 1.4 1.4m11.4 11.4 1.4 1.4"/>
          <path d="m4.9 19.1 1.4-1.4m11.4-11.4 1.4-1.4"/>
        </svg>
        <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/>
        </svg>
      </span>
    </button>
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开目录" aria-expanded="false">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
  </div>
</header>

<div class="layout">

  <!-- ============ 左侧目录 ============ -->
  <aside class="side" id="side">
    <div class="side-top">
      <a class="side-name" href="#top" data-nav id="sideName"></a>
      <p class="side-note" id="sideNote"></p>
    </div>

    <nav class="toc" id="toc" aria-label="章节目录"></nav>

    <div class="side-foot">
      <button class="icon-btn only-desktop" id="themeBtn" aria-label="切换主题" title="切换主题">
        <span class="theme-icons">
          <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>
            <path d="m4.9 4.9 1.4 1.4m11.4 11.4 1.4 1.4"/>
            <path d="m4.9 19.1 1.4-1.4m11.4-11.4 1.4-1.4"/>
          </svg>
          <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/>
          </svg>
        </span>
      </button>
      <a href="https://github.com/xfgken" target="_blank" rel="noopener">GitHub</a>
          </div>
  </aside>

  <!-- ============ 正文（全部由 js 按内容数据渲染） ============ -->
  <main class="content" id="top">
    <header class="opening" id="opening"></header>
    <div id="sections"></div>
    <p class="closing" id="closing" hidden></p>

    <footer class="foot">
      <span id="footText"></span>
      <a href="#top" data-nav>回到顶部</a>
    </footer>
  </main>
</div>

<!-- ============================================================
     成长历程 · 侧滑面板（内容由 js 渲染）
     ============================================================ -->
<div class="gpanel" id="gpanel" aria-hidden="true">
  <div class="gpanel-mask" data-gclose></div>
  <div class="gpanel-sheet" role="dialog" aria-modal="true" aria-label="成长历程">
    <header class="gpanel-head">
      <div>
        <span class="gpanel-eyebrow" id="panelEyebrow">成长历程</span>
        <h2 id="panelSubtitle"></h2>
      </div>
      <button class="icon-btn" data-gclose aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="gpanel-body" id="gpanelBody"></div>
  </div>
</div>

<!-- 项目详情抽屉 -->
<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-mask" data-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true">
    <header class="drawer-head">
      <div>
        <span class="lang" id="pdLang">—</span>
        <h3 id="pdTitle">项目</h3>
      </div>
      <button class="icon-btn" data-close aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="drawer-body" id="pdBody"></div>
    <footer class="drawer-foot" id="pdFoot"></footer>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/content-data.js"></script>
<script src="js/main.js?v=55"></script>
</body>
</html>
