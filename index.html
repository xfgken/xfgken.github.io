<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xfgken · Material You</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
/* ===== MD3 Design Tokens（单色系 · 仅深浅区别） ===== */
:root{
  --primary:#6750A4;
  --on-primary:#FFFFFF;
  --primary-container:#EADDFF;
  --on-primary-container:#21005D;
  --surface:#FEF7FF;
  --on-surface:#1D1B20;
  --surface-container-low:#F7F2FA;
  --surface-container-high:#ECE6F0;
  --on-surface-variant:#49454F;
  --outline-variant:#CAC4D0;
}
[data-theme="dark"]{
  --primary:#D0BCFF;
  --on-primary:#381E72;
  --primary-container:#4F378B;
  --on-primary-container:#EADDFF;
  --surface:#141218;
  --on-surface:#E6E0E9;
  --surface-container-low:#1D1B20;
  --surface-container-high:#2B2930;
  --on-surface-variant:#CAC4D0;
  --outline-variant:#49454F;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;}

/* ===== 页面加载动画（莫奈浅色背景 + 深色小转圈） ===== */
#loading{
  position:fixed;inset:0;z-index:99;
  background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  opacity:1;visibility:visible;
  transition:opacity .6s ease,visibility .6s ease;
}
#loading.hide{opacity:0;visibility:hidden;pointer-events:none;}
.spinner{
  width:38px;height:38px;border-radius:50%;
  border:4px solid var(--primary-container);
  border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

body{
  font-family:'Baloo 2','MiSans','HarmonyOS Sans SC','HarmonyOS Sans','MiUI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  background:var(--surface);
  color:var(--on-surface);
  min-height:100%;
  display:flex;flex-direction:column;
  transition:background-color .9s ease,color .9s ease;
}

/* ===== Material Symbols 系统图标 ===== */
.material-symbols-outlined{
  font-family:'Material Symbols Outlined';
  font-weight:normal;font-style:normal;
  font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;
  display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;
  font-variation-settings:'FILL'0,'wght'500,'GRAD'0,'opsz'24;
}

/* ===== Top App Bar（名字在左上角） ===== */
.appbar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  height:64px;padding:0 16px;
  background:var(--surface);
  transition:background-color .9s ease;
}
.appbar .title{font-size:31px;font-weight:800;letter-spacing:.3px;color:var(--primary);transition:color .9s ease;}
.appbar-actions{display:flex;gap:8px;}

/* ===== MD3 圆形图标按钮（无阴影） ===== */
.icon-btn{
  position:relative;overflow:hidden;
  width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;
  background:transparent;color:var(--on-surface);
  display:inline-flex;align-items:center;justify-content:center;
  transition:background-color .2s,color .9s ease,transform .1s;
}
.icon-btn:hover{background:rgba(128,128,128,.12);}
.icon-btn:active{transform:scale(.88);}

/* 主题图标：太阳/月亮 旋转+交叉淡入 */
.theme-ico{position:relative;width:24px;height:24px;display:block;transition:transform .6s cubic-bezier(.2,0,0,1);}
.theme-ico.spin{transform:rotate(360deg);}
.theme-ico .ms{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .5s cubic-bezier(.2,0,0,1),opacity .3s;}
.theme-ico .sun{opacity:1;transform:rotate(0deg) scale(1);}
.theme-ico .moon{opacity:0;transform:rotate(-90deg) scale(.2);}
[data-theme="dark"] .theme-ico .sun{opacity:0;transform:rotate(90deg) scale(.2);}
[data-theme="dark"] .theme-ico .moon{opacity:1;transform:rotate(0deg) scale(1);}

.app{max-width:640px;width:100%;margin:0 auto;padding:18px 16px 8px;flex:1;}

/* ===== 我的信条（打字机 · 放大 · 居中 · 正常行距） ===== */
.creed-text{
  font-size:clamp(26px,7.5vw,34px);
  font-weight:700;letter-spacing:.5px;line-height:1.15;
  color:var(--on-surface);
  min-height:60px;
  width:100%;
  margin-bottom:14px;
  text-align:center;
  transition:color .9s ease;
}
.creed-text span{transition:color .9s ease;}
.creed-text .c1{color:var(--c1);}
.creed-text .c2{color:var(--c2);}
.creed-text .c3{color:var(--c3);}
.creed-text .c4{color:var(--c4);}
.cursor{
  display:inline-block;font-weight:800;
  animation:blink .9s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* ===== 三个标签：横排均匀分布 · 压扁减小 ===== */
.tag-row{
  display:flex;gap:10px;
}
.tag{
  flex:1;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:40px;border-radius:14px;
  border:1px solid var(--outline-variant);
  background:var(--surface-container-low);
  color:var(--on-surface);
  font-size:13px;font-weight:700;
  transition:background-color .9s ease,color .9s ease,border-color .9s ease;
}
.tag .material-symbols-outlined{font-size:18px;color:var(--primary);transition:color .9s ease;}

/* ===== 卡片（圆角矩形 · 同色系浅深 · 顶部边框嵌标题） ===== */
.card{
  position:relative;
  background:var(--surface-container-low);
  border:1px solid var(--outline-variant);
  border-radius:24px;padding:20px;margin-top:16px;
  min-inline-size:0;
  transition:background-color .9s ease,border-color .9s ease,color .9s ease;
}
/* 标题嵌在卡片顶部边框线左侧（原生 legend · 文字下方主题色横线） */
.card legend{
  margin:0;
  padding:0 10px 2px;
  color:var(--on-surface-variant);
  font-size:13px;font-weight:700;letter-spacing:3px;
  white-space:nowrap;text-align:left;
  background:transparent;
  border-bottom:2px solid var(--primary);
  transition:color .9s ease,border-color .9s ease;
}
.card-ico{
  width:44px;height:44px;border-radius:14px;flex-shrink:0;
  background:var(--primary-container);color:var(--on-primary-container);
  display:flex;align-items:center;justify-content:center;
  transition:background-color .9s ease,color .9s ease;
}
.card-ico .material-symbols-outlined{font-size:22px;}

/* 项目卡片 */
.proj .phead{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.proj .pname{font-size:18px;font-weight:700;}
.proj .ptag{font-size:12px;font-weight:600;color:var(--on-surface-variant);margin-top:2px;transition:color .9s ease;}
.proj p{font-size:14px;color:var(--on-surface-variant);line-height:1.7;margin-bottom:16px;transition:color .9s ease;}

/* MD3 Filled Button（无阴影 · 半宽靠左） */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  width:50%;min-width:160px;height:48px;border-radius:24px;border:none;cursor:pointer;
  background:var(--primary);color:var(--on-primary);
  font-size:15px;font-weight:700;letter-spacing:1px;text-decoration:none;
  font-family:inherit;position:relative;overflow:hidden;
  transition:background-color .9s ease,color .9s ease,transform .1s;
}
.btn:active{transform:scale(.97);}
.btn svg{width:20px;height:20px;}

/* 联系卡片 */
.contact .cbody{display:flex;align-items:center;gap:16px;}
.contact .t{font-size:13px;color:var(--on-surface-variant);text-decoration:none;transition:color .9s ease;}
.contact .t b{display:block;font-size:16px;color:var(--on-surface);font-weight:700;margin-top:3px;letter-spacing:.3px;transition:color .9s ease;}

/* ===== Footer ===== */
footer{
  text-align:center;font-size:14px;font-weight:600;color:var(--on-surface-variant);
  margin-top:20px;padding:12px 0 8px;
  letter-spacing:1px;
  transition:color .9s ease;
}

/* ===== 换色按钮图标（点击旋转 + 随机换色） ===== */
.palette-ico{position:relative;width:24px;height:24px;display:block;transition:transform .6s cubic-bezier(.2,0,0,1);}
.palette-ico.spin{transform:rotate(360deg);}
.palette-ico .ms{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .4s cubic-bezier(.2,0,0,1),opacity .25s;}

/* ===== Ripple ===== */
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.12;transform:scale(0);animation:ripple .5s ease-out forwards;pointer-events:none;}
@keyframes ripple{to{transform:scale(2.6);opacity:0;}}

@media (max-width:400px){
  .tag{font-size:13px;}
}
</style>
</head>
<body>

<!-- 加载动画遮罩 -->
<div id="loading">
  <div class="spinner"></div>
</div>

<!-- Top App Bar -->
<header class="appbar">
  <span class="title">xfgken</span>
  <div class="appbar-actions">
    <button class="icon-btn" id="themeBtn" title="切换深浅色">
      <span class="theme-ico" id="themeIco">
        <span class="ms sun material-symbols-outlined">light_mode</span>
        <span class="ms moon material-symbols-outlined">dark_mode</span>
      </span>
    </button>
    <button class="icon-btn" id="paletteBtn" title="换色">
      <span class="palette-ico" id="paletteIco">

</header>

<main class="app">

  <p class="creed-text">

    <span class="c4" id="t4"></span><span class="cursor" id="creedCursor">_</span>
  </p>

  <!-- 三个标签 -->
  <div class="tag-row">
    <span class="tag"><span class="material-symbols-outlined">style</span>简约</span>
    <span class="tag"><span class="material-symbols-outlined">lightbulb</span>思考</span>

  <!-- 项目 -->
  <fieldset class="card proj">

    <div class="phead">
      <div class="card-ico"><span class="material-symbols-outlined">package_2</span></div>
      <div>
        <div class="pname">hysteria2_quick_script</div>
        <div class="ptag">Bash · 一键脚本</div>
      </div>
    </div>
    <p>基于 Bash 的 Hysteria2 一键管理脚本，专注快速、简约、轻量，内置混淆，无需域名即可部署。</p>
    <a class="btn" href="https://github.com/xfgken/hysteria2_quick_script" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      GitHub
    </a>
  </fieldset>

  <!-- 联系我 -->
  <fieldset class="card contact">
    <legend>联系我</legend>
    <div class="cbody">
      <div class="card-ico"><span class="material-symbols-outlined">mail</span></div>
      <a class="t" href="mailto:xfgken@gmail.com">欢迎交流，可通过邮箱联系<b>xfgken@gmail.com</b></a>
    </div>
  </fieldset>
</main>

<footer>©2026 xfgken · Material You</footer>

<script>
/* ===== 配色方案（MD3 tonal palettes） ===== */
const PALETTES=[
  {name:'紫色',light:{p:'#6750A4',op:'#FFFFFF',pc:'#EADDFF',opc:'#21005D'},dark:{p:'#D0BCFF',op:'#381E72',pc:'#4F378B',opc:'#EADDFF'}},
  {name:'粉色',light:{p:'#B0277A',op:'#FFFFFF',pc:'#FFD8EC',opc:'#3E0022'},dark:{p:'#FFADE0',op:'#5C0039',pc:'#7F0050',opc:'#FFD8EC'}},
  {name:'蓝色',light:{p:'#0061A4',op:'#FFFFFF',pc:'#D1E4FF',opc:'#001D33'},dark:{p:'#A2C9FF',op:'#003257',pc:'#00497A',opc:'#D1E4FF'}},
  {name:'绿色',light:{p:'#006C4C',op:'#FFFFFF',pc:'#9EF2CB',opc:'#002113'},dark:{p:'#83D5AF',op:'#003824',pc:'#005138',opc:'#9EF2CB'}},
  {name:'橙色',light:{p:'#8B5000',op:'#FFFFFF',pc:'#FFDDB5',opc:'#2D1600'},dark:{p:'#FFB868',op:'#492900',pc:'#6B3D00',opc:'#FFDDB5'}},
  {name:'红色',light:{p:'#B3261E',op:'#FFFFFF',pc:'#FFDAD6',opc:'#410002'},dark:{p:'#FFB4AB',op:'#690005',pc:'#93000A',opc:'#FFDAD6'}},
  {name:'青色',light:{p:'#00696E',op:'#FFFFFF',pc:'#9CF0F6',opc:'#002022'},dark:{p:'#80D4DA',op:'#00363A',pc:'#004F53',opc:'#9CF0F6'}},
  {name:'靛蓝',light:{p:'#4355B9',op:'#FFFFFF',pc:'#DEE0FF',opc:'#00105C'},dark:{p:'#BEC2FF',op:'#001A94',pc:'#2F3F9E',opc:'#DEE0FF'}},
  {name:'棕色',light:{p:'#7A5548',op:'#FFFFFF',pc:'#FFDCCB',opc:'#311400'},dark:{p:'#F4BBA9',op:'#4D2619',pc:'#663C2E',opc:'#FFDCCB'}},
  {name:'金色',light:{p:'#6E5B00',op:'#FFFFFF',pc:'#FFDFA1',opc:'#201B00'},dark:{p:'#EEC254',op:'#373000',pc:'#504600',opc:'#FFDFA1'}},
  {name:'灰色',light:{p:'#5B5F66',op:'#FFFFFF',pc:'#DFE2EA',opc:'#181C22'},dark:{p:'#C3C7D0',op:'#2C3138',pc:'#43474E',opc:'#DFE2EA'}},
  {name:'青柠',light:{p:'#4E6400',op:'#FFFFFF',pc:'#B8F28B',opc:'#141F00'},dark:{p:'#9DD66A',op:'#233900',pc:'#335000',opc:'#B8F28B'}}
];

const root=document.documentElement;
const LS='xfgken_';
function isDark(){return root.getAttribute('data-theme')==='dark';}

/* 应用 MD3 色板 */
function applyPalette(p){
  const t=isDark()?p.dark:p.light;
  root.style.setProperty('--primary',t.p);
  root.style.setProperty('--on-primary',t.op);
  root.style.setProperty('--primary-container',t.pc);
  root.style.setProperty('--on-primary-container',t.opc);
  setCreedColors(t.p); /* 信条 4 段分区着色 */
}

/* 颜色深浅混合：向白（浅色模式）或向黑（深色模式）渐变 4 档 */
function shade(hex,toward,t){
  const n=parseInt(hex.slice(1),16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const m=toward==='white'?255:0;
  const f=c=>Math.round(c+(m-c)*t);
  return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1);
}
/* 信条 4 段颜色：永远(最深) → 相信 → 美好的事情 → 即将发生(最浅) */
function setCreedColors(primaryHex){
  const dir=isDark()?'white':'black';
  root.style.setProperty('--c1',primaryHex);
  root.style.setProperty('--c2',shade(primaryHex,dir,.25));
  root.style.setProperty('--c3',shade(primaryHex,dir,.5));
  root.style.setProperty('--c4',shade(primaryHex,dir,.75));
}

/* 状态：默认紫色（每次打开网页）；点击换色按钮随机换色 */
let state={idx:0};

/* 当前配色：默认紫色 */
function currentPalette(){
  return PALETTES[state.idx]||PALETTES[0];
}

/* 随机换一个颜色（不与当前相同） */
function randomizeColor(){
  let idx;
  do{
    idx=Math.floor(Math.random()*PALETTES.length);
  }while(idx===state.idx&&PALETTES.length>1);
  state.idx=idx;
  applyPalette(PALETTES[idx]);
}

/* 深浅切换：图标旋转360° + 页面慢速变暗 */
const themeBtn=document.getElementById('themeBtn');
const themeIco=document.getElementById('themeIco');
themeBtn.addEventListener('click',()=>{
  themeIco.classList.remove('spin');
  void themeIco.offsetWidth;
  themeIco.classList.add('spin');
  root.setAttribute('data-theme',isDark()?'light':'dark');
  localStorage.setItem(LS+'theme',isDark()?'dark':'light');
  const cur=currentPalette();
  if(cur)applyPalette(cur);
  setTimeout(()=>themeIco.classList.remove('spin'),650);
});

/* 换色按钮：点击一次，图标旋转 360° + 随机换色 */
const paletteBtn=document.getElementById('paletteBtn');
const paletteIco=document.getElementById('paletteIco');
paletteBtn.addEventListener('click',()=>{
  paletteIco.classList.remove('spin');
  void paletteIco.offsetWidth;
  paletteIco.classList.add('spin');
  randomizeColor();
  setTimeout(()=>paletteIco.classList.remove('spin'),650);
});

/* MD3 Ripple */
document.addEventListener('click',e=>{
  const btn=e.target.closest('.icon-btn,.btn');
  if(!btn)return;
  const rect=btn.getBoundingClientRect();
  const size=Math.max(rect.width,rect.height);
  const r=document.createElement('span');
  r.className='ripple';
  r.style.width=r.style.height=size+'px';
  r.style.left=(e.clientX-rect.left-size/2)+'px';
  r.style.top=(e.clientY-rect.top-size/2)+'px';
  btn.appendChild(r);
  setTimeout(()=>r.remove(),500);
});

/* 页面加载完成后隐藏加载动画（含兜底） */
(function hideLoading(){
  const hide=()=>{const l=document.getElementById('loading');if(l)l.classList.add('hide');};
  if(document.readyState==='complete'){
    setTimeout(hide,500);
  }else{
    window.addEventListener('load',()=>setTimeout(hide,500));
  }
  setTimeout(hide,2500);
})();

/* 初始化：默认紫色 */
(function init(){
  const savedTheme=localStorage.getItem(LS+'theme');
  if(savedTheme)root.setAttribute('data-theme',savedTheme);
  const p=currentPalette();
  if(p)applyPalette(p);
})();

/* 信条打字机效果（4 段分区着色 · 光标跟随逐字闪烁） */
const creedParts=['永远','相信','美好的事情','即将发生'];
const creedEls=[document.getElementById('t1'),document.getElementById('t2'),document.getElementById('t3'),document.getElementById('t4')];
const creedCursor=document.getElementById('creedCursor');
let pi=0,ci=0;
(function type(){
  if(pi>=creedParts.length)return;
  const el=creedEls[pi];
  const part=creedParts[pi];
  el.textContent=part.slice(0,ci);
  el.after(creedCursor); /* 光标紧跟当前正在打的字 */
  ci++;
  if(ci>part.length){
    ci=0;pi++;
    if(pi>=creedParts.length)return; /* 全部打完，光标停在最后继续闪烁 */
  }
  setTimeout(type,185);
})();
</script>
</body>
