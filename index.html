<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xfgken · Material You</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
/* ===== MD3 Design Tokens（单色系 · 仅深浅区别） ===== */
:root{
  --primary:#6750A4;
  --on-primary:#FFFFFF;
  --primary-container:#EADDFF;
  --on-primary-container:#21005D;
  --surface:#FEF7FF;
  --on-surface:#1D1B20;
  --surface-container-low:#F7F2FA;
  --surface-container-high:#ECE6F0;
  --on-surface-variant:#49454F;
  --outline-variant:#CAC4D0;
}
[data-theme="dark"]{
  --primary:#D0BCFF;
  --on-primary:#381E72;
  --primary-container:#4F378B;
  --on-primary-container:#EADDFF;
  --surface:#141218;
  --on-surface:#E6E0E9;
  --surface-container-low:#1D1B20;
  --surface-container-high:#2B2930;
  --on-surface-variant:#CAC4D0;
  --outline-variant:#49454F;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;}
body{
  font-family:'Baloo 2','MiSans','HarmonyOS Sans SC','HarmonyOS Sans','MiUI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  background:var(--surface);
  color:var(--on-surface);
  min-height:100%;
  transition:background-color .9s ease,color .9s ease;
}

/* ===== Material Symbols 系统图标 ===== */
.material-symbols-outlined{
  font-family:'Material Symbols Outlined';
  font-weight:normal;font-style:normal;
  font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;
  display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;
  font-variation-settings:'FILL'0,'wght'500,'GRAD'0,'opsz'24;
}

/* ===== Top App Bar（普通顶栏 · 名字在左上角） ===== */
.appbar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  height:64px;padding:0 16px;
  background:var(--surface);
  transition:background-color .9s ease;
}
.appbar .title{font-size:20px;font-weight:800;letter-spacing:.3px;}
.appbar-actions{display:flex;gap:8px;}

/* ===== MD3 圆形图标按钮（无阴影） ===== */
.icon-btn{
  position:relative;overflow:hidden;
  width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;
  background:transparent;color:var(--on-surface);
  display:inline-flex;align-items:center;justify-content:center;
  transition:background-color .2s,color .9s ease,transform .1s;
}
.icon-btn:hover{background:rgba(128,128,128,.12);}
.icon-btn:active{transform:scale(.88);}

/* 主题图标：太阳/月亮 旋转+交叉淡入 */
.theme-ico{position:relative;width:24px;height:24px;display:block;transition:transform .6s cubic-bezier(.2,0,0,1);}
.theme-ico.spin{transform:rotate(360deg);}
.theme-ico .ms{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .5s cubic-bezier(.2,0,0,1),opacity .3s;}
.theme-ico .sun{opacity:1;transform:rotate(0deg) scale(1);}
.theme-ico .moon{opacity:0;transform:rotate(-90deg) scale(.2);}
[data-theme="dark"] .theme-ico .sun{opacity:0;transform:rotate(90deg) scale(.2);}
[data-theme="dark"] .theme-ico .moon{opacity:1;transform:rotate(0deg) scale(1);}

.app{max-width:640px;margin:0 auto;padding:8px 16px 32px;}

/* ===== Hero（头像靠左 · 不居中） ===== */
.hero{
  display:flex;align-items:center;gap:20px;
  padding:28px 24px;
  background:var(--primary-container);
  border-radius:28px;
  transition:background-color .9s ease;
}
.hero .avatar{
  width:88px;height:88px;border-radius:50%;object-fit:cover;flex-shrink:0;
  border:3px solid var(--surface);
  transition:border-color .9s ease;
}
.hero .creed{
  font-size:17px;font-weight:600;line-height:1.8;letter-spacing:.5px;
  color:var(--on-primary-container);
  transition:color .9s ease;
}

/* ===== Chips（outlined 小芯片） ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 4px 0;}
.chip{
  display:inline-flex;align-items:center;gap:8px;
  height:34px;padding:0 14px 0 12px;border-radius:8px;
  border:1px solid var(--outline-variant);
  background:transparent;
  color:var(--on-surface);
  font-size:14px;font-weight:700;
  transition:background-color .9s ease,color .9s ease,border-color .9s ease;
}
.chip .material-symbols-outlined{font-size:17px;color:var(--primary);transition:color .9s ease;}

/* ===== 卡片（outlined · 无阴影 · 单色） ===== */
.card{
  background:var(--surface-container-low);
  border:1px solid var(--outline-variant);
  border-radius:24px;padding:22px;margin-top:20px;
  transition:background-color .9s ease,border-color .9s ease,color .9s ease;
}
.card-ico{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:var(--primary-container);color:var(--on-primary-container);
  display:flex;align-items:center;justify-content:center;
  transition:background-color .9s ease,color .9s ease;
}
.card-ico .material-symbols-outlined{font-size:22px;}

/* 项目卡片 */
.proj .phead{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.proj .pname{font-size:18px;font-weight:700;}
.proj .ptag{font-size:12px;font-weight:600;color:var(--on-surface-variant);margin-top:2px;transition:color .9s ease;}
.proj p{font-size:14px;color:var(--on-surface-variant);line-height:1.8;margin-bottom:18px;transition:color .9s ease;}

/* MD3 Filled Button（无阴影） */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;height:48px;border-radius:24px;border:none;cursor:pointer;
  background:var(--primary);color:var(--on-primary);
  font-size:15px;font-weight:700;letter-spacing:1px;text-decoration:none;
  font-family:inherit;position:relative;overflow:hidden;
  transition:background-color .9s ease,color .9s ease,transform .1s;
}
.btn:active{transform:scale(.97);}
.btn svg{width:20px;height:20px;}

/* 联系卡片 */
.contact{display:flex;align-items:center;gap:16px;}
.contact .t{font-size:13px;color:var(--on-surface-variant);text-decoration:none;transition:color .9s ease;}
.contact .t b{display:block;font-size:16px;color:var(--on-surface);font-weight:700;margin-top:3px;letter-spacing:.3px;transition:color .9s ease;}

/* ===== Footer ===== */
footer{
  text-align:center;font-size:14px;font-weight:600;color:var(--on-surface-variant);
  margin-top:32px;padding:18px 0 8px;
  border-top:1px solid var(--outline-variant);
  letter-spacing:1px;
  transition:color .9s ease,border-color .9s ease;
}

/* ===== 调色板面板：从右上角按钮整体缩放（圆形→方形，圆角连续过渡） ===== */
.palette-panel{
  position:fixed;top:72px;right:16px;z-index:21;
  width:min(380px,calc(100vw - 32px));
  padding:24px;
  background:var(--surface-container-high);
  color:var(--on-surface);
  border-radius:50%;
  transform-origin:top right;
  transform:scale(.1);
  opacity:0;pointer-events:none;
  transition:transform .45s cubic-bezier(.2,0,0,1),border-radius .45s cubic-bezier(.2,0,0,1),opacity .25s,background-color .9s ease;
}
.palette-panel.open{
  transform:scale(1);
  border-radius:24px;
  opacity:1;pointer-events:auto;
}
.palette-panel .inner{opacity:0;transition:opacity .3s .18s;}
.palette-panel.open .inner{opacity:1;}
.palette-panel h3{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:.3px;}
.palette-panel .hint{font-size:12px;color:var(--on-surface-variant);margin-bottom:18px;transition:color .9s ease;}
.swatches{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:22px;}
.sw{
  width:46px;height:46px;border-radius:50%;border:2px solid var(--outline-variant);
  cursor:pointer;position:relative;
  transition:transform .2s cubic-bezier(.2,0,0,1),border-color .2s;
}
.sw:hover{transform:scale(1.15);}
.sw.active{border:3px solid var(--on-surface);outline:2px solid var(--primary);outline-offset:1px;transition:border-color .2s,outline-color .5s ease;}
.custom-row{display:flex;align-items:center;gap:14px;}
.custom-row label{font-size:14px;color:var(--on-surface-variant);flex:1;font-weight:600;transition:color .9s ease;}
.color-input{
  width:46px;height:46px;border-radius:50%;border:2px solid var(--outline-variant);
  cursor:pointer;padding:0;overflow:hidden;background:transparent;
}
.color-input::-webkit-color-swatch-wrapper{padding:0;}
.color-input::-webkit-color-swatch{border:none;border-radius:50%;}
.hex{font-size:13px;font-family:monospace;color:var(--on-surface);min-width:72px;transition:color .9s ease;}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;}
.text-btn{
  height:40px;padding:0 20px;border-radius:20px;border:none;cursor:pointer;
  background:transparent;color:var(--primary);
  font-size:14px;font-weight:700;letter-spacing:1px;position:relative;overflow:hidden;
  font-family:inherit;transition:background-color .2s,color .9s ease;
}
.text-btn:hover{background:rgba(128,128,128,.12);}

/* ===== Ripple ===== */
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.12;transform:scale(0);animation:ripple .5s ease-out forwards;pointer-events:none;}
@keyframes ripple{to{transform:scale(2.6);opacity:0;}}

@media (max-width:400px){
  .hero .avatar{width:72px;height:72px;}
  .hero .creed{font-size:15px;}
}
</style>
</head>
<body>

<!-- 调色板面板：从右上角按钮整体放大 -->

<script>
/* ===== 配色方案（MD3 tonal palettes） ===== */
const PALETTES=[
  {name:'紫色',light:{p:'#6750A4',op:'#FFFFFF',pc:'#EADDFF',opc:'#21005D'},dark:{p:'#D0BCFF',op:'#381E72',pc:'#4F378B',opc:'#EADDFF'}},
  {name:'粉色',light:{p:'#B0277A',op:'#FFFFFF',pc:'#FFD8EC',opc:'#3E0022'},dark:{p:'#FFADE0',op:'#5C0039',pc:'#7F0050',opc:'#FFD8EC'}},
  {name:'蓝色',light:{p:'#0061A4',op:'#FFFFFF',pc:'#D1E4FF',opc:'#001D33'},dark:{p:'#A2C9FF',op:'#003257',pc:'#00497A',opc:'#D1E4FF'}},
  {name:'绿色',light:{p:'#006C4C',op:'#FFFFFF',pc:'#9EF2CB',opc:'#002113'},dark:{p:'#83D5AF',op:'#003824',pc:'#005138',opc:'#9EF2CB'}},
  {name:'橙色',light:{p:'#8B5000',op:'#FFFFFF',pc:'#FFDDB5',opc:'#2D1600'},dark:{p:'#FFB868',op:'#492900',pc:'#6B3D00',opc:'#FFDDB5'}},
  {name:'红色',light:{p:'#B3261E',op:'#FFFFFF',pc:'#FFDAD6',opc:'#410002'},dark:{p:'#FFB4AB',op:'#690005',pc:'#93000A',opc:'#FFDAD6'}},
  {name:'青色',light:{p:'#00696E',op:'#FFFFFF',pc:'#9CF0F6',opc:'#002022'},dark:{p:'#80D4DA',op:'#00363A',pc:'#004F53',opc:'#9CF0F6'}},
  {name:'靛蓝',light:{p:'#4355B9',op:'#FFFFFF',pc:'#DEE0FF',opc:'#00105C'},dark:{p:'#BEC2FF',op:'#001A94',pc:'#2F3F9E',opc:'#DEE0FF'}},
  {name:'棕色',light:{p:'#7A5548',op:'#FFFFFF',pc:'#FFDCCB',opc:'#311400'},dark:{p:'#F4BBA9',op:'#4D2619',pc:'#663C2E',opc:'#FFDCCB'}},
  {name:'金色',light:{p:'#6E5B00',op:'#FFFFFF',pc:'#FFDFA1',opc:'#201B00'},dark:{p:'#EEC254',op:'#373000',pc:'#504600',opc:'#FFDFA1'}},
  {name:'灰色',light:{p:'#5B5F66',op:'#FFFFFF',pc:'#DFE2EA',opc:'#181C22'},dark:{p:'#C3C7D0',op:'#2C3138',pc:'#43474E',opc:'#DFE2EA'}},
  {name:'青柠',light:{p:'#4E6400',op:'#FFFFFF',pc:'#B8F28B',opc:'#141F00'},dark:{p:'#9DD66A',op:'#233900',pc:'#335000',opc:'#B8F28B'}}
];

const root=document.documentElement;
const LS='xfgken_';
function isDark(){return root.getAttribute('data-theme')==='dark';}

/* 应用 MD3 色板 */
function applyPalette(p){
  const t=isDark()?p.dark:p.light;
  root.style.setProperty('--primary',t.p);
  root.style.setProperty('--on-primary',t.op);
  root.style.setProperty('--primary-container',t.pc);
  root.style.setProperty('--on-primary-container',t.opc);
  const hexInput=document.getElementById('colorInput');
  const hexText=document.getElementById('hexText');
  if(hexInput){hexInput.value=t.p;hexText.textContent=t.p;}
}

/* 自定义颜色 → 近似 MD3 派生色板 */
function applyCustom(hex){
  root.style.setProperty('--primary',hex);
  root.style.setProperty('--on-primary',isLight(hex)?'#1D1B20':'#FFFFFF');
  root.style.setProperty('--primary-container',mixHex(hex,'#FFFFFF',.8));
  root.style.setProperty('--on-primary-container',mixHex(hex,'#000000',.62));
  const hexInput=document.getElementById('colorInput');
  const hexText=document.getElementById('hexText');
  if(hexInput){hexInput.value=hex;hexText.textContent=hex;}
}
function isLight(hex){
  const n=parseInt(hex.slice(1),16);
  return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))>150;
}
function mixHex(a,b,t){
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const r=Math.round(((pa>>16)&255)*(1-t)+((pb>>16)&255)*t);
  const g=Math.round(((pa>>8)&255)*(1-t)+((pb>>8)&255)*t);
  const bl=Math.round((pa&255)*(1-t)+(pb&255)*t);
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}

/* 状态：默认仅紫色一种，用户选择后记住 */
let state={
  mode:localStorage.getItem(LS+'mode')||'default',
  idx:parseInt(localStorage.getItem(LS+'idx')||'0',10),
  custom:localStorage.getItem(LS+'custom')||''
};

/* 当前配色：默认=紫色（唯一默认色）；manual=用户选择 */
function currentPalette(){
  if(state.mode==='manual'){
    if(state.custom)return null;
    return PALETTES[state.idx]||PALETTES[0];
  }
  return PALETTES[0]; /* 默认紫色 */
}

/* 随机抽取 6 种配色供选择 */
function pickRandom(n){
  const arr=[...PALETTES],out=[];
  while(arr.length&&out.length<n){
    out.push(arr.splice(Math.floor(Math.random()*arr.length),1)[0]);
  }
  return out;
}

/* 构建 6 色板 */
function buildSwatches(){
  const box=document.getElementById('swatches');
  box.innerHTML='';
  const list=pickRandom(6);
  const cur=currentPalette();
  list.forEach(p=>{
    const b=document.createElement('button');
    b.className='sw';
    b.style.background=isDark()?p.dark.p:p.light.p;
    b.title=p.name;
    if(cur&&p.name===cur.name)b.classList.add('active');
    b.onclick=()=>{
      state.mode='manual';state.custom='';state.idx=PALETTES.indexOf(p);
      localStorage.setItem(LS+'mode','manual');
      localStorage.setItem(LS+'idx',String(state.idx));
      localStorage.removeItem(LS+'custom');
      applyPalette(p); /* CSS变量变化 → 0.9s 慢速过渡变色 */
      buildSwatches();
    };
    box.appendChild(b);
  });
}

/* 深浅切换：图标旋转360° + 页面慢速变暗 */
const themeBtn=document.getElementById('themeBtn');
const themeIco=document.getElementById('themeIco');
themeBtn.addEventListener('click',()=>{
  themeIco.classList.remove('spin');
  void themeIco.offsetWidth;
  themeIco.classList.add('spin');
  root.setAttribute('data-theme',isDark()?'light':'dark');
  localStorage.setItem(LS+'theme',isDark()?'dark':'light');
  const cur=currentPalette();
  if(cur)applyPalette(cur);
  else applyCustom(state.custom||'#6750A4');
  buildSwatches();
  setTimeout(()=>themeIco.classList.remove('spin'),650);
});

/* 调色板：右上角按钮位置整体放大（圆形→方形，圆角连续过渡） */
const panel=document.getElementById('palettePanel');
const paletteBtn=document.getElementById('paletteBtn');
function openPanel(){
  buildSwatches();
  panel.classList.add('open');
}
function closePanel(){
  panel.classList.remove('open');
}
paletteBtn.addEventListener('click',openPanel);
document.getElementById('closeDialog').addEventListener('click',closePanel);
document.addEventListener('click',e=>{
  if(panel.classList.contains('open')&&!panel.contains(e.target)&&!paletteBtn.contains(e.target)){
    closePanel();
  }
});

/* 自定义颜色（圆形选择器） */
document.getElementById('colorInput').addEventListener('input',e=>{
  const hex=e.target.value;
  state.mode='manual';state.custom=hex;
  localStorage.setItem(LS+'mode','manual');
  localStorage.setItem(LS+'custom',hex);
  applyCustom(hex);
  document.getElementById('hexText').textContent=hex;
  document.querySelectorAll('.sw').forEach(s=>s.classList.remove('active'));
});

/* MD3 Ripple */
document.addEventListener('click',e=>{
  const btn=e.target.closest('.icon-btn,.btn,.text-btn,.sw');
  if(!btn)return;
  const rect=btn.getBoundingClientRect();
  const size=Math.max(rect.width,rect.height);
  const r=document.createElement('span');
  r.className='ripple';
  r.style.width=r.style.height=size+'px';
  r.style.left=(e.clientX-rect.left-size/2)+'px';
  r.style.top=(e.clientY-rect.top-size/2)+'px';
  btn.appendChild(r);
  setTimeout(()=>r.remove(),500);
});

/* 初始化：默认紫色（仅一种颜色） */
(function init(){
  const savedTheme=localStorage.getItem(LS+'theme');
  if(savedTheme)root.setAttribute('data-theme',savedTheme);
  const p=currentPalette();
  if(p)applyPalette(p);
  else applyCustom(state.custom||'#6750A4');
  buildSwatches();
})();
</script>
