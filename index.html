<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xfgken · Material You</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== MD3 Design Tokens ===== */
:root{
  --primary:#6750A4;
  --on-primary:#FFFFFF;
  --primary-container:#EADDFF;
  --on-primary-container:#21005D;
  --secondary:#625B71;
  --on-secondary:#FFFFFF;
  --secondary-container:#E8DEF8;
  --on-secondary-container:#1D192B;
  --tertiary:#7D5260;
  --surface:#FEF7FF;
  --on-surface:#1D1B20;
  --surface-container-lowest:#FFFFFF;
  --surface-container-low:#F7F2FA;
  --surface-container:#F3EDF7;
  --surface-container-high:#ECE6F0;
  --surface-container-highest:#E6E0E9;
  --on-surface-variant:#49454F;
  --outline-variant:#CAC4D0;
  --scrim:rgba(0,0,0,.4);
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
  --shadow-2:0 1px 2px rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.15);
  --shadow-3:0 4px 8px 3px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.3);
}
[data-theme="dark"]{
  --primary:#D0BCFF;
  --on-primary:#381E72;
  --primary-container:#4F378B;
  --on-primary-container:#EADDFF;
  --secondary:#CCC2DC;
  --on-secondary:#332D41;
  --secondary-container:#4A4458;
  --on-secondary-container:#E8DEF8;
  --tertiary:#EFB8C8;
  --surface:#141218;
  --on-surface:#E6E0E9;
  --surface-container-lowest:#0F0D13;
  --surface-container-low:#1D1B20;
  --surface-container:#211F26;
  --surface-container-high:#2B2930;
  --surface-container-highest:#36343B;
  --on-surface-variant:#CAC4D0;
  --outline-variant:#49454F;
  --scrim:rgba(0,0,0,.5);
  --shadow-1:0 1px 2px rgba(0,0,0,.5),0 1px 3px 1px rgba(0,0,0,.3);
  --shadow-2:0 1px 2px rgba(0,0,0,.5),0 2px 6px 2px rgba(0,0,0,.35);
  --shadow-3:0 4px 8px 3px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;}
body{
  font-family:'Baloo 2','MiSans','HarmonyOS Sans SC','HarmonyOS Sans','MiUI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  background:var(--surface);
  color:var(--on-surface);
  min-height:100%;
  transition:background .45s cubic-bezier(.2,0,0,1),color .45s cubic-bezier(.2,0,0,1);
}

/* ===== Large Top App Bar（MD3 大顶栏） ===== */
.appbar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:flex-end;justify-content:space-between;
  height:104px;padding:0 20px 12px;
  background:var(--surface);
}
.appbar{background:color-mix(in srgb,var(--surface)92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
.appbar .title{font-size:28px;font-weight:800;letter-spacing:.3px;}
.appbar-actions{display:flex;gap:4px;}

/* ===== MD3 圆形图标按钮 48dp ===== */
.icon-btn{
  position:relative;overflow:hidden;
  width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(128,128,128,.12);
  color:var(--on-surface);
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .2s,transform .1s;
}
.icon-btn:hover{background:rgba(128,128,128,.2);}
.icon-btn:active{transform:scale(.88);}
.icon-btn svg{width:24px;height:24px;}

/* 主题图标：太阳/月亮 旋转+交叉淡入 */
.theme-ico{position:relative;width:24px;height:24px;display:block;transition:transform .6s cubic-bezier(.2,0,0,1);}
.theme-ico.spin{transform:rotate(360deg);}
.theme-ico .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .5s cubic-bezier(.2,0,0,1),opacity .3s;}
.theme-ico .sun{transform:rotate(0deg) scale(1);opacity:1;}
.theme-ico .moon{transform:rotate(-90deg) scale(.2);opacity:0;}
[data-theme="dark"] .theme-ico .sun{transform:rotate(90deg) scale(.2);opacity:0;}
[data-theme="dark"] .theme-ico .moon{transform:rotate(0deg) scale(1);opacity:1;}

.app{max-width:640px;margin:0 auto;padding:8px 16px 32px;}

/* ===== Hero（大渐变卡片 + 居中头像） ===== */
.hero{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:36px 24px 28px;
  background:linear-gradient(160deg,var(--primary-container),var(--surface-container));
  border-radius:36px;
  box-shadow:var(--shadow-2);
  transition:background .45s,box-shadow .3s;
}
.hero .avatar{
  width:104px;height:104px;border-radius:50%;object-fit:cover;
  border:4px solid var(--surface);
  box-shadow:var(--shadow-2);
  transition:border-color .45s;
}
.hero .name{
  margin-top:16px;font-size:30px;font-weight:800;letter-spacing:.5px;
  color:var(--on-primary-container);
  transition:color .45s;
}
.cursor{display:inline-block;width:4px;height:26px;background:currentColor;vertical-align:-4px;margin-left:3px;border-radius:2px;animation:blink 1s step-end infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
.hero .creed{
  margin-top:6px;font-size:16px;font-weight:600;letter-spacing:.5px;
  color:var(--on-primary-container);opacity:.9;
  transition:color .45s;
}

/* ===== Chips（hero 内胶囊标签） ===== */
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
.hero .chip{
  display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 16px 0 12px;border-radius:17px;
  background:rgba(255,255,255,.28);
  color:var(--on-primary-container);
  font-size:14px;font-weight:700;
  box-shadow:var(--shadow-1);
  transition:background .45s,color .45s;
}
[data-theme="dark"] .hero .chip{background:rgba(255,255,255,.14);}
.hero .chip svg{width:16px;height:16px;}

/* ===== 分区标题 ===== */
.sec-head{
  display:flex;align-items:center;gap:10px;
  margin:28px 12px 12px;
}
.sec-head .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);transition:background .45s;}
.sec-head span{font-size:15px;font-weight:700;letter-spacing:1px;color:var(--on-surface-variant);transition:color .45s;}

/* ===== 卡片（MD3 surface 分层） ===== */
.card{
  background:var(--surface-container-low);
  border-radius:28px;padding:22px;
  box-shadow:var(--shadow-1);
  transition:background .45s,box-shadow .3s,transform .3s;
}
.card-hover:hover{box-shadow:var(--shadow-2);transform:translateY(-2px);}

/* 信条卡片 */
.creed-card{display:flex;align-items:flex-start;gap:16px;}
.creed-card .q{
  width:48px;height:48px;border-radius:16px;flex-shrink:0;
  background:var(--primary-container);color:var(--on-primary-container);
  display:flex;align-items:center;justify-content:center;
  transition:background .45s,color .45s;
}
.creed-card .q svg{width:24px;height:24px;}
.creed-card p{font-size:17px;font-weight:600;line-height:1.8;letter-spacing:.5px;padding-top:6px;}

/* 项目卡片 */
.proj .phead{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.proj .phead .logo{
  width:52px;height:52px;border-radius:16px;flex-shrink:0;
  background:var(--primary);color:var(--on-primary);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-2);
  transition:background .45s,color .45s;
}
.proj .phead .logo svg{width:28px;height:28px;}
.proj .pname{font-size:19px;font-weight:700;}
.proj .ptag{font-size:12px;font-weight:600;color:var(--on-surface-variant);margin-top:2px;transition:color .45s;}
.proj p{font-size:14px;color:var(--on-surface-variant);line-height:1.8;margin-bottom:18px;transition:color .45s;}

/* MD3 Filled Button（全宽） */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;height:48px;border-radius:24px;border:none;cursor:pointer;
  background:var(--primary);color:var(--on-primary);
  font-size:15px;font-weight:700;letter-spacing:1px;text-decoration:none;
  font-family:inherit;
  box-shadow:var(--shadow-1);position:relative;overflow:hidden;
  transition:box-shadow .2s,transform .1s,background .45s,color .45s;
}
.btn:hover{box-shadow:var(--shadow-2);}
.btn:active{transform:scale(.97);}
.btn svg{width:20px;height:20px;}

/* 联系卡片 */
.contact-card{display:flex;align-items:center;gap:16px;}
.contact-card .ico{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  background:var(--secondary-container);color:var(--on-secondary-container);
  display:flex;align-items:center;justify-content:center;
  transition:background .45s,color .45s;
}
.contact-card .ico svg{width:26px;height:26px;}
.contact-card .t{font-size:13px;color:var(--on-surface-variant);transition:color .45s;}
.contact-card .t b{display:block;font-size:16px;color:var(--on-surface);font-weight:700;margin-top:3px;letter-spacing:.3px;transition:color .45s;}

/* ===== Footer ===== */
footer{
  text-align:center;font-size:14px;font-weight:600;color:var(--on-surface-variant);
  margin-top:32px;padding:18px 0 8px;
  border-top:1px solid var(--outline-variant);
  letter-spacing:1px;
  transition:color .45s,border .45s;
}

/* ===== Scrim ===== */
.scrim{
  position:fixed;inset:0;background:var(--scrim);
  opacity:0;pointer-events:none;z-index:20;
  transition:opacity .3s cubic-bezier(.2,0,0,1);
}
.scrim.show{opacity:1;pointer-events:auto;}

/* ===== 调色板 Dialog：从按钮位置小放大到中心 ===== */
.dialog{
  position:fixed;left:50%;top:50%;z-index:21;
  width:min(400px,calc(100vw - 32px));
  transform:translate(-50%,-50%) scale(.15);
  opacity:0;pointer-events:none;
  background:var(--surface-container-high);color:var(--on-surface);
  border-radius:28px;padding:24px;box-shadow:var(--shadow-3);
  transition:left .35s cubic-bezier(.2,0,0,1),top .35s cubic-bezier(.2,0,0,1),transform .35s cubic-bezier(.2,0,0,1),opacity .22s,background .45s;
}
.dialog.show{opacity:1;pointer-events:auto;}
.dialog.expanded{transform:translate(-50%,-50%) scale(1);}
.dialog h3{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:.3px;}
.dialog .hint{font-size:12px;color:var(--on-surface-variant);margin-bottom:18px;transition:color .45s;}
.swatches{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:22px;}
.sw{
  width:46px;height:46px;border-radius:50%;border:2px solid var(--outline-variant);
  cursor:pointer;position:relative;
  transition:transform .2s cubic-bezier(.2,0,0,1),box-shadow .2s,border .2s;
}
.sw:hover{transform:scale(1.15);box-shadow:var(--shadow-2);}
.sw.active{border-color:var(--on-surface);box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--primary);}
.custom-row{display:flex;align-items:center;gap:14px;}
.custom-row label{font-size:14px;color:var(--on-surface-variant);flex:1;font-weight:600;transition:color .45s;}
.color-input{
  width:46px;height:46px;border-radius:50%;border:2px solid var(--outline-variant);
  cursor:pointer;padding:0;overflow:hidden;background:transparent;
  box-shadow:var(--shadow-1);
}
.color-input::-webkit-color-swatch-wrapper{padding:0;}
.color-input::-webkit-color-swatch{border:none;border-radius:50%;}
.hex{font-size:13px;font-family:monospace;color:var(--on-surface);min-width:72px;transition:color .45s;}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;}
.text-btn{
  height:40px;padding:0 20px;border-radius:20px;border:none;cursor:pointer;
  background:transparent;color:var(--primary);
  font-size:14px;font-weight:700;letter-spacing:1px;position:relative;overflow:hidden;
  font-family:inherit;transition:background .2s,color .45s;
}
.text-btn:hover{background:rgba(128,128,128,.15);}

/* ===== Ripple ===== */
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.12;transform:scale(0);animation:ripple .5s ease-out forwards;pointer-events:none;}
@keyframes ripple{to{transform:scale(2.6);opacity:0;}}

@media (max-width:400px){
  .hero .avatar{width:88px;height:88px;}
  .hero .name{font-size:26px;}
}
</style>
</head>

<script>
/* ===== 配色方案（MD3 tonal palettes） ===== */
const PALETTES=[
  {name:'紫色',light:{p:'#6750A4',op:'#FFFFFF',pc:'#EADDFF',opc:'#21005D'},dark:{p:'#D0BCFF',op:'#381E72',pc:'#4F378B',opc:'#EADDFF'}},
  {name:'蓝色',light:{p:'#0061A4',op:'#FFFFFF',pc:'#D1E4FF',opc:'#001D33'},dark:{p:'#A2C9FF',op:'#003257',pc:'#00497A',opc:'#D1E4FF'}},
  {name:'绿色',light:{p:'#006C4C',op:'#FFFFFF',pc:'#9EF2CB',opc:'#002113'},dark:{p:'#83D5AF',op:'#003824',pc:'#005138',opc:'#9EF2CB'}},
  {name:'橙色',light:{p:'#8B5000',op:'#FFFFFF',pc:'#FFDDB5',opc:'#2D1600'},dark:{p:'#FFB868',op:'#492900',pc:'#6B3D00',opc:'#FFDDB5'}},
  {name:'红色',light:{p:'#B3261E',op:'#FFFFFF',pc:'#FFDAD6',opc:'#410002'},dark:{p:'#FFB4AB',op:'#690005',pc:'#93000A',opc:'#FFDAD6'}},
  {name:'青色',light:{p:'#00696E',op:'#FFFFFF',pc:'#9CF0F6',opc:'#002022'},dark:{p:'#80D4DA',op:'#00363A',pc:'#004F53',opc:'#9CF0F6'}},
  {name:'粉色',light:{p:'#B0277A',op:'#FFFFFF',pc:'#FFD8EC',opc:'#3E0022'},dark:{p:'#FFADE0',op:'#5C0039',pc:'#7F0050',opc:'#FFD8EC'}},
  {name:'靛蓝',light:{p:'#4355B9',op:'#FFFFFF',pc:'#DEE0FF',opc:'#00105C'},dark:{p:'#BEC2FF',op:'#001A94',pc:'#2F3F9E',opc:'#DEE0FF'}},
  {name:'棕色',light:{p:'#7A5548',op:'#FFFFFF',pc:'#FFDCCB',opc:'#311400'},dark:{p:'#F4BBA9',op:'#4D2619',pc:'#663C2E',opc:'#FFDCCB'}},
  {name:'金色',light:{p:'#6E5B00',op:'#FFFFFF',pc:'#FFDFA1',opc:'#201B00'},dark:{p:'#EEC254',op:'#373000',pc:'#504600',opc:'#FFDFA1'}},
  {name:'灰色',light:{p:'#5B5F66',op:'#FFFFFF',pc:'#DFE2EA',opc:'#181C22'},dark:{p:'#C3C7D0',op:'#2C3138',pc:'#43474E',opc:'#DFE2EA'}},
  {name:'青柠',light:{p:'#4E6400',op:'#FFFFFF',pc:'#B8F28B',opc:'#141F00'},dark:{p:'#9DD66A',op:'#233900',pc:'#335000',opc:'#B8F28B'}}
];

const root=document.documentElement;
const LS='xfgken_';
function isDark(){return root.getAttribute('data-theme')==='dark';}

/* 应用 MD3 色板 */
function applyPalette(p){
  const t=isDark()?p.dark:p.light;
  root.style.setProperty('--primary',t.p);
  root.style.setProperty('--on-primary',t.op);
  root.style.setProperty('--primary-container',t.pc);
  root.style.setProperty('--on-primary-container',t.opc);
  const hexInput=document.getElementById('colorInput');
  const hexText=document.getElementById('hexText');
  if(hexInput){hexInput.value=t.p;hexText.textContent=t.p;}
}

/* 自定义颜色 → 近似 MD3 派生色板 */
function applyCustom(hex){
  root.style.setProperty('--primary',hex);
  root.style.setProperty('--on-primary',isLight(hex)?'#1D1B20':'#FFFFFF');
  root.style.setProperty('--primary-container',mixHex(hex,'#FFFFFF',.8));
  root.style.setProperty('--on-primary-container',mixHex(hex,'#000000',.62));
  const hexInput=document.getElementById('colorInput');
  const hexText=document.getElementById('hexText');
  if(hexInput){hexInput.value=hex;hexText.textContent=hex;}
}
function isLight(hex){
  const n=parseInt(hex.slice(1),16);
  return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))>150;
}
function mixHex(a,b,t){
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const r=Math.round(((pa>>16)&255)*(1-t)+((pb>>16)&255)*t);
  const g=Math.round(((pa>>8)&255)*(1-t)+((pb>>8)&255)*t);
  const bl=Math.round((pa&255)*(1-t)+(pb&255)*t);
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}

/* 状态 */
let autoPick=null;
let state={
  mode:localStorage.getItem(LS+'mode')||'auto',
  idx:parseInt(localStorage.getItem(LS+'idx')||'0',10),
  custom:localStorage.getItem(LS+'custom')||''
};

/* 当前配色：auto=刷新随机（首次默认紫色）；manual=用户选择 */
function currentPalette(){
  if(state.mode==='manual'){
    if(state.custom)return null;
    return PALETTES[state.idx]||PALETTES[0];
  }
  if(autoPick)return autoPick;
  if(localStorage.getItem(LS+'first')===null){
    localStorage.setItem(LS+'first','1');
    autoPick=PALETTES[0]; /* 默认紫色 */
  }else{
    autoPick=PALETTES[Math.floor(Math.random()*PALETTES.length)];
  }
  return autoPick;
}

/* 随机抽取 6 种配色 */
function pickRandom(n){
  const arr=[...PALETTES],out=[];
  while(arr.length&&out.length<n){
    out.push(arr.splice(Math.floor(Math.random()*arr.length),1)[0]);
  }
  return out;
}

/* 构建 6 色板 */
function buildSwatches(){
  const box=document.getElementById('swatches');
  box.innerHTML='';
  const list=pickRandom(6);
  const cur=currentPalette();
  list.forEach(p=>{
    const b=document.createElement('button');
    b.className='sw';
    b.style.background=isDark()?p.dark.p:p.light.p;
    b.title=p.name;
    if(cur&&p.name===cur.name)b.classList.add('active');
    b.onclick=()=>{
      state.mode='manual';state.custom='';state.idx=PALETTES.indexOf(p);
      localStorage.setItem(LS+'mode','manual');
      localStorage.setItem(LS+'idx',String(state.idx));
      localStorage.removeItem(LS+'custom');
      applyPalette(p);
      buildSwatches();
    };
    box.appendChild(b);
  });
}

/* 深浅切换：图标旋转360° + 页面变暗 */
const themeBtn=document.getElementById('themeBtn');
const themeIco=document.getElementById('themeIco');
themeBtn.addEventListener('click',()=>{
  themeIco.classList.remove('spin');
  void themeIco.offsetWidth; /* 触发 reflow 重启动画 */
  themeIco.classList.add('spin');
  root.setAttribute('data-theme',isDark()?'light':'dark');
  localStorage.setItem(LS+'theme',isDark()?'dark':'light');
  const cur=currentPalette();
  if(cur)applyPalette(cur);
  else applyCustom(state.custom||'#6750A4');
  buildSwatches();
  setTimeout(()=>themeIco.classList.remove('spin'),650);
});

/* 调色板：从按钮位置小缩放放大到中心 */
const scrim=document.getElementById('scrim');
const dialog=document.getElementById('dialog');
const paletteBtn=document.getElementById('paletteBtn');
function openDialog(){
  buildSwatches();
  const r=paletteBtn.getBoundingClientRect();
  dialog.style.left=(r.left+r.width/2)+'px';
  dialog.style.top=(r.top+r.height/2)+'px';
  dialog.classList.remove('expanded');
  dialog.classList.add('show');
  scrim.classList.add('show');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    dialog.style.left='50%';
    dialog.style.top='50%';
    dialog.classList.add('expanded');
  }));
}
function closeDialog(){
  scrim.classList.remove('show');
  const r=paletteBtn.getBoundingClientRect();
  dialog.style.left=(r.left+r.width/2)+'px';
  dialog.style.top=(r.top+r.height/2)+'px';
  dialog.classList.remove('expanded');
  setTimeout(()=>dialog.classList.remove('show'),380);
}
paletteBtn.addEventListener('click',openDialog);
document.getElementById('closeDialog').addEventListener('click',closeDialog);
scrim.addEventListener('click',closeDialog);

/* 自定义颜色（圆形选择器） */
document.getElementById('colorInput').addEventListener('input',e=>{
  const hex=e.target.value;
  state.mode='manual';state.custom=hex;
  localStorage.setItem(LS+'mode','manual');
  localStorage.setItem(LS+'custom',hex);
  applyCustom(hex);
  document.getElementById('hexText').textContent=hex;
  document.querySelectorAll('.sw').forEach(s=>s.classList.remove('active'));
});

/* MD3 Ripple */
document.addEventListener('click',e=>{
  const btn=e.target.closest('.icon-btn,.btn,.text-btn,.sw');
  if(!btn)return;
  const rect=btn.getBoundingClientRect();
  const size=Math.max(rect.width,rect.height);
  const r=document.createElement('span');
  r.className='ripple';
  r.style.width=r.style.height=size+'px';
  r.style.left=(e.clientX-rect.left-size/2)+'px';
  r.style.top=(e.clientY-rect.top-size/2)+'px';
  btn.appendChild(r);
  setTimeout(()=>r.remove(),500);
});

/* 初始化 */
(function init(){
  const savedTheme=localStorage.getItem(LS+'theme');
  if(savedTheme)root.setAttribute('data-theme',savedTheme);
  const p=currentPalette();
  if(p)applyPalette(p);
  else applyCustom(state.custom||'#6750A4');
  buildSwatches();
})();

/* 打字机 */
const text="xfgken";
const el=document.getElementById('typed');
let i=0;
(function type(){
  if(i<text.length){el.textContent+=text.charAt(i);i++;setTimeout(type,150);}
})();
</script>
